name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build and publish (e.g. v0.2.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Windows x64 (Installer + Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and validate Cargo.toml
        id: meta
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          if (-not $tag.StartsWith("v")) {
            throw "Release tag must start with 'v', got: $tag"
          }
          $version = $tag.Substring(1)
          $cargoToml = Get-Content Cargo.toml -Raw
          if ($cargoToml -match '(?m)^version\s*=\s*"([^"]+)"') {
            $cargoVer = $Matches[1]
          } else {
            throw "Failed to parse version from Cargo.toml"
          }
          if ($cargoVer -ne $version) {
            throw "Tag version ($version) does not match Cargo.toml version ($cargoVer)"
          }
          $isPrerelease = if ($version.Contains("-")) { "true" } else { "false" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        shell: pwsh
        run: cargo test --locked

      - name: Build Release binary
        shell: pwsh
        run: cargo build --release --locked

      - name: Package portable ZIP and Inno Setup installer
        id: pkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ steps.meta.outputs.tag }}"
          $version = "${{ steps.meta.outputs.version }}"
          $repo = "${{ github.repository }}"

          New-Item -ItemType Directory -Force -Path dist | Out-Null
          New-Item -ItemType Directory -Force -Path dist/stage | Out-Null

          Copy-Item -Force target/release/kestrel.exe dist/stage/Kestrel.exe

          # 1. Portable ZIP
          $zipName = "kestrel-$tag-windows-x86_64.zip"
          $zipPath = Join-Path "dist" $zipName
          Compress-Archive -Path "dist/stage/Kestrel.exe" -DestinationPath $zipPath -Force

          # 2. User-scope Inno Setup installer
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $candidates = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $isccPath) {
              choco install innosetup -y --no-progress
              $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            }
          } else {
            $isccPath = $iscc.Source
          }
          if (-not $isccPath) {
            throw "ISCC.exe (Inno Setup 6) not found"
          }

          $exeAbs = (Resolve-Path "dist/stage/Kestrel.exe").Path
          $distAbs = (Resolve-Path "dist").Path
          & $isccPath "/DMyAppVersion=$version" "/DMyExePath=$exeAbs" "/DMyOutputDir=$distAbs" "packaging/windows/kestrel.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "ISCC failed with exit code $LASTEXITCODE"
          }

          $installerName = "Kestrel-Setup-v$version-x64.exe"
          $installerPath = Join-Path "dist" $installerName
          if (-not (Test-Path $installerPath)) {
            throw "Expected installer not found at $installerPath"
          }

          # 3. Compute SHA-256 checksums and generate manifest.json
          $zipHash = (Get-FileHash -Algorithm SHA256 -Path $zipPath).Hash.ToLowerInvariant()
          $zipSize = (Get-Item $zipPath).Length
          $instHash = (Get-FileHash -Algorithm SHA256 -Path $installerPath).Hash.ToLowerInvariant()
          $instSize = (Get-Item $installerPath).Length

          @(
            "$zipHash  $zipName"
            "$instHash  $installerName"
          ) | Set-Content -Path "dist/SHA256SUMS.txt" -Encoding utf8NoBOM

          $publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $baseDownload = "https://github.com/$repo/releases/download/$tag"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"
          $prevTag = (git tag --sort=-v:refname | Where-Object { $_ -ne $tag } | Select-Object -First 1)
          if ($prevTag) {
            $logLines = git log "$prevTag..HEAD" --pretty=format:"- %s" --no-merges | Select-Object -First 30
            $notes = ($logLines -join "`n")
          } else {
            $notes = "Kestrel $tag 发布包，包含 Windows x64 用户级安装包（免 UAC）与便携单文件压缩包。"
          }
          if ([string]::IsNullOrWhiteSpace($notes)) {
            $notes = "Kestrel $tag 发布包，包含 Windows x64 用户级安装包（免 UAC）与便携单文件压缩包。"
          }

          $manifest = [ordered]@{
            schema       = 1
            version      = $version
            published_at = $publishedAt
            prerelease   = ("${{ steps.meta.outputs.prerelease }}" -eq "true")
            release_url  = $releaseUrl
            notes        = $notes
            assets       = [ordered]@{
              "windows-x86_64" = [ordered]@{
                portable  = [ordered]@{
                  url       = "$baseDownload/$zipName"
                  file_name = "Kestrel.exe"
                  size      = $zipSize
                  sha256    = $zipHash
                }
                installer = [ordered]@{
                  url       = "$baseDownload/$installerName"
                  file_name = $installerName
                  size      = $instSize
                  sha256    = $instHash
                }
              }
            }
          }

          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path "dist/manifest.json" -Encoding utf8NoBOM

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Kestrel ${{ steps.meta.outputs.tag }}
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            dist/kestrel-*.zip
            dist/Kestrel-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/manifest.json
