[package]
name = "kestrel"
version = "0.1.0"
edition = "2024"
description = "Kestrel — a fast, lightweight code editor built in Rust"
license = "MIT"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu", "default_fonts", "system_fonts"] }
egui = "0.37"

ropey = "1.6"
regex = "1.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
notify = "8.2"
ignore = "0.4"
rfd = "0.18"
arboard = "3.7"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "ico", "tiff", "webp"] }
flate2 = "1.1"
roxmltree = "0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Pdf", "Storage", "Storage_Streams", "Foundation", "Win32_System_WinRT"] }

tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-json = "0.24"
tree-sitter-toml-ng = "0.7"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-css = "0.25"
tree-sitter-bash = "0.25"
tree-sitter-yaml = "0.7"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"

portable-pty = "0.9"
vt100 = "0.18"
mlua = { version = "0.12", features = ["lua54", "vendored"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
